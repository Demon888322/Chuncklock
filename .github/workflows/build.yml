name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / Paper API ${{ matrix.paper-api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper-api:
          - 1.20.4-R0.1-SNAPSHOT
          - 1.21.11-R0.1-SNAPSHOT

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress -Dpaper.api.version=${{ matrix.paper-api }} clean verify
