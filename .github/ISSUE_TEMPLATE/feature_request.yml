name: Feature request
description: Suggest an improvement to ChunkLock.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first to see whether this idea has already been discussed.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation or player need would this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention other approaches or workarounds you have considered.
    validations:
      required: false
