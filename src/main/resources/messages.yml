prefix: "<dark_gray>[<aqua>ChunkLock</aqua>]</dark_gray> "
messages:
  database-loading: "<yellow>Claim data is loading. Please try again shortly.</yellow>"
  database-error: "<red>Claim storage is unavailable. Check the server logs or contact an administrator.</red>"
  no-permission: "<red>You do not have permission to use this command.</red>"
  player-only: "<red>This command is only available to players in game.</red>"
  usage: "<gray>Usage: <aqua>/chunk <claim|unclaim|trust|untrust|flag|info|visualize|admin></aqua>.</gray>"
  claimed: "<green>Claim created for chunk <white><x>, <z></white>.</green>"
  already-claimed: "<red>This chunk is already claimed.</red>"
  claim-limit: "<red>Claim limit reached. Your limit is <white><limit></white>.</red>"
  unclaimed: "<green>Your claim has been removed.</green>"
  not-claimed: "<red>This chunk is not claimed.</red>"
  not-owner: "<red>You do not own this chunk.</red>"
  trusted: "<green><white><player></white> can now build in this claim.</green>"
  untrusted: "<green><white><player></white> can no longer build in this claim.</green>"
  player-not-online: "<red>That player must be online to be added or removed.</red>"
  already-trusted: "<yellow>That player already has access to this claim.</yellow>"
  not-trusted: "<yellow>That player does not have access to this claim.</yellow>"
  flag-set: "<green>Claim flag <white><flag></white> is now <white><value></white>.</green>"
  invalid-flag: "<red>Unknown flag. Available flags: pvp, explosions, chest-access, redstone, mob-spawning.</red>"
  invalid-boolean: "<red>Enter <white>true</white> or <white>false</white> for the flag value.</red>"
  info-header: "<aqua><bold>Claim details</bold></aqua>"
  info-owner: "<gray>Owner: <white><owner></white></gray>"
  info-trusted: "<gray>Trusted: <white><members></white></gray>"
  info-flags: "<gray>Flags: <white><flags></white></gray>"
  visualization-on: "<green>Claim-boundary visualization enabled.</green>"
  visualization-off: "<yellow>Claim-boundary visualization disabled.</yellow>"
  admin-unclaimed: "<green>The claim has been removed.</green>"
  saved: "<green>Claim changes saved.</green>"
  save-failed: "<red>Could not save this claim. Check the server logs and try again.</red>"
